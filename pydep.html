<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<title>Pydep is now PySpire</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --bg: #FBFBFD;
  --bg-grad-top: #FBFBFD;
  --bg-grad-bot: #FBFBFD;
  --surface: #ffffff;
  --surface-2: #fafafc;
  --surface-3: #f2f2f5;

  --ink: #1d1d1f;
  --ink-2: #424245;
  --ink-3: #6e6e73;
  --ink-4: #86868b;
  --ink-5: #b4b4b8;

  --blue: #2563EB;
  --blue-hover: #1D4ED8;
  --blue-wash: #EAF0FE;
  --blue-soft: #C7D7FB;
  --dep-blue: #2563EB;
  --dep-blue-hover: #1D4ED8;

  --purple-wash:#f6ecfb;

  --hair: rgba(0,0,0,0.10);
  --hair-strong: rgba(0,0,0,0.15);

  --glass: rgba(251,251,253,0.78);
  --glass-blur: saturate(180%) blur(24px);

  --e1: 0 1px 2px rgba(0,0,0,0.04), 0 1px 1px rgba(0,0,0,0.02);
  --e2: 0 4px 12px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.03);

  --r-4:4px; --r-6:6px; --r-8:8px; --r-10:10px; --r-12:12px;
  --r-14:14px; --r-16:16px; --r-full:9999px;

  --ease: cubic-bezier(0.4, 0.0, 0.2, 1);
  --ease-emph: cubic-bezier(0.2, 0.0, 0, 1);
  --dur-1: 140ms;
  --dur-2: 220ms;
  --dur-3: 360ms;

  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}
html[data-theme="dark"]{
  --bg:#000;
  --bg-grad-top:#0a0a0c;
  --bg-grad-bot:#000;
  --surface:#1c1c1e;
  --surface-2:#161618;
  --surface-3:#26262a;

  --ink:#f5f5f7;
  --ink-2:#d2d2d7;
  --ink-3:#a1a1a6;
  --ink-4:#86868b;

  --blue:#60A5FA;
  --blue-wash:rgba(37,99,235,0.18);
  --blue-soft:rgba(37,99,235,0.30);
  --dep-blue:#3B82F6;
  --dep-blue-hover:#60A5FA;

  --purple-wash:rgba(191,90,242,0.18);

  --hair:rgba(255,255,255,0.08);
  --hair-strong:rgba(255,255,255,0.14);

  --glass:rgba(28,28,30,0.72);

  --e1: 0 1px 2px rgba(0,0,0,0.4);
  --e2: 0 4px 14px rgba(0,0,0,0.45);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%; overflow:hidden;}
body{
  font-family:var(--font-sans);
  color:var(--ink);
  background:
    radial-gradient(1200px 600px at 80% -10%, var(--blue-wash) 0%, transparent 60%),
    radial-gradient(900px 500px at -10% 30%, var(--purple-wash) 0%, transparent 60%),
    linear-gradient(180deg, var(--bg-grad-top), var(--bg-grad-bot));
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.005em;
  display: flex;
  flex-direction: column;
}

.nav{
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  height: 56px;
  background: var(--glass);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border-bottom: 1px solid var(--hair);
}
.nav-inner{
  max-width: 1180px; margin: 0 auto;
  height: 100%; padding: 0 24px;
  display: flex; align-items: center; justify-content: space-between;
}
.brand{
  display:flex; align-items:center; gap:10px;
  font-family: 'Outfit', var(--font-sans);
  font-weight:700; letter-spacing:-0.025em; font-size:19px; color:var(--ink);
  text-decoration:none;
}
.brand .grad{
  color: #2563EB;
  background: none;
  -webkit-text-fill-color: #2563EB;
}
html[data-theme="dark"] .brand .grad{
  color: #3B82F6;
  -webkit-text-fill-color: #3B82F6;
}
.theme-toggle{
  width:34px; height:34px; border-radius:50%;
  border:1px solid var(--hair); background:transparent; cursor:pointer;
  color: var(--ink-2);
  display:grid; place-items:center;
  transition: all var(--dur-1) var(--ease);
}
.theme-toggle:hover{ color:var(--ink); border-color:var(--hair-strong); background:var(--surface-3); }
.theme-toggle svg{ width:16px; height:16px; }
.theme-toggle .icon-sun{ display:none; }
html[data-theme="dark"] .theme-toggle .icon-sun{ display:block; }
html[data-theme="dark"] .theme-toggle .icon-moon{ display:none; }

.shell{
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 0 24px;
  position: relative;
  z-index: 10;
}
.hero{ text-align:center; max-width: 600px; width: 100%; }

.wordmark{ margin-bottom: 18px; }
.wordmark-text{
  font-family: 'Outfit', var(--font-sans);
  font-weight: 700;
  font-size: 56px;
  line-height: 1.1;
  letter-spacing: -0.04em;
  color: var(--ink);
}
.wordmark-text .old-name {
  text-decoration: line-through;
  color: var(--ink-4);
  margin-right: 12px;
}
.wordmark-text .grad{
  color: #2563EB;
  -webkit-text-fill-color: #2563EB;
}
html[data-theme="dark"] .wordmark-text .grad{
  color: #3B82F6;
  -webkit-text-fill-color: #3B82F6;
}
.tagline{
  font: 450 18px/1.5 var(--font-sans);
  color: var(--ink-3);
  letter-spacing: -0.01em;
  margin-top: 14px;
  margin-bottom: 36px;
}

.search-stage{
  margin: 0 auto;
  max-width: 580px;
  position: relative;
}
.search{
  display:flex; align-items:center; gap:6px;
  height: 48px;
  padding: 0 6px 0 18px;
  border-radius: var(--r-full);
  position: relative;
  background: linear-gradient(180deg, rgba(244,245,248,0.72), rgba(238,240,244,0.34));
  backdrop-filter: saturate(180%) blur(30px);
  -webkit-backdrop-filter: saturate(180%) blur(30px);
  border: 1px solid rgba(0,0,0,0.12);
  box-shadow: 0 8px 32px rgba(31,38,135,0.12), 0 2px 8px rgba(0,0,0,0.04), inset 0 1px 1px rgba(255,255,255,0.7);
  cursor: pointer;
  transition: all var(--dur-2) var(--ease);
}
html[data-theme="dark"] .search{
  background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.02));
  border: 1px solid rgba(255,255,255,0.14);
  box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.18);
}
.search:hover{
  border-color: var(--blue-soft);
  box-shadow: 0 10px 36px rgba(31,38,135,0.16), 0 0 0 4px var(--blue-wash), inset 0 1px 1px rgba(255,255,255,0.7);
  transform: translateY(-2px);
}
.search svg.search-glyph{
  width:20px; height:20px; color:var(--ink-3); flex-shrink:0;
}
.search input[type=text]{
  flex:1; min-width:0;
  border:none; outline:none; background:transparent;
  font:500 16px/1 var(--font-sans);
  color: var(--ink); padding: 0 8px;
  cursor: pointer;
}
.search input::placeholder{ color: var(--ink-4); font-weight:400; }
.search button.go{
  height: 36px; min-width: 36px;
  padding: 0 16px;
  border:none; cursor:pointer;
  background: var(--dep-blue); color:#fff;
  font: 600 14px/1 var(--font-sans);
  border-radius: var(--r-full);
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  box-shadow: 0 4px 14px rgba(33,150,243,0.28);
  pointer-events: none;
}

.redirect-btn{
  margin-top: 24px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 24px;
  border-radius: var(--r-full);
  background: var(--surface);
  border: 1px solid var(--hair-strong);
  color: var(--ink);
  font: 600 15px/1 var(--font-sans);
  cursor: pointer;
  box-shadow: var(--e1);
  transition: all var(--dur-2) var(--ease);
}
.redirect-btn:hover {
  background: var(--surface-2);
  border-color: var(--blue);
  color: var(--blue);
  transform: translateY(-2px);
  box-shadow: var(--e2);
}
.redirect-btn svg { width: 18px; height: 18px; }

/* Animation Classes */
.shake-hard {
  animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both infinite;
  transform: translate3d(0, 0, 0);
  backface-visibility: hidden;
  perspective: 1000px;
}

@keyframes shake {
  10%, 90% { transform: translate3d(-2px, 2px, 0) rotate(-1deg); }
  20%, 80% { transform: translate3d(3px, -2px, 0) rotate(1deg); }
  30%, 50%, 70% { transform: translate3d(-4px, 4px, 0) rotate(-2deg); }
  40%, 60% { transform: translate3d(4px, -4px, 0) rotate(2deg); }
}

.rocket-container {
  position: fixed;
  bottom: -150px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  font-size: 80px;
  transition: bottom 1.5s cubic-bezier(0.5, 0, 0.2, 1);
  opacity: 0;
  pointer-events: none;
  filter: drop-shadow(0 20px 30px rgba(255, 100, 0, 0.5));
}

.rocket-container.launch {
  opacity: 1;
  bottom: 120vh;
  animation: blastShake 0.1s infinite;
}

@keyframes blastShake {
  0% { margin-left: -2px; }
  50% { margin-left: 2px; }
  100% { margin-left: 0; }
}

.smoke-particle {
  position: fixed;
  bottom: 0;
  border-radius: 50%;
  background: rgba(200, 200, 200, 0.8);
  pointer-events: none;
  z-index: 99;
  animation: smokeFade 1s forwards;
}
html[data-theme="dark"] .smoke-particle {
  background: rgba(50, 50, 50, 0.9);
}

@keyframes smokeFade {
  0% { transform: scale(0.5); opacity: 1; bottom: -50px; }
  100% { transform: scale(3); opacity: 0; bottom: 200px; }
}

.fade-to-black {
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 9999;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.8s ease;
}
.fade-to-black.active {
  opacity: 1;
}

/* UI Elements disappearing */
.poof {
  animation: poofOut 0.3s forwards;
}
@keyframes poofOut {
  0% { transform: scale(1); opacity: 1; }
  100% { transform: scale(1.5); opacity: 0; filter: blur(10px); }
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="brand" href="#">
      <span class="brand-text">Py<span class="grad">Spire</span></span>
    </a>
    <button class="theme-toggle" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>
  </div>
</nav>

<div class="shell" id="main-shell">
  <section class="hero" id="hero-content">
    <div class="wordmark">
      <div class="wordmark-text" id="headline">
        <span class="old-name">Pydep</span><br/>is now Py<span class="grad">Spire</span>
      </div>
      <div class="tagline" id="subheadline">
        The ultimate Python package search engine has a new home.
      </div>
    </div>

    <div class="search-stage" id="search-container">
      <div class="search" onclick="triggerLaunch()">
        <svg class="search-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Search a Python package…" readonly />
        <button class="go">
          <span>Search</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </div>
    </div>

    <button class="redirect-btn" id="redirect-btn" onclick="triggerLaunch()">
      Click here to go to PySpire
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>
  </section>
</div>

<!-- Animation Assets -->
<div class="rocket-container" id="rocket">🚀</div>
<div class="fade-to-black" id="fade-overlay"></div>

<script>
  // Theme Management
  const root = document.documentElement;
  const toggle = document.getElementById('theme-toggle');
  
  const saved = localStorage.getItem('-theme');
  if(saved === 'dark') root.setAttribute('data-theme','dark');
  else if(saved === 'light') root.setAttribute('data-theme','light');
  else if(window.matchMedia('(prefers-color-scheme: dark)').matches) root.setAttribute('data-theme','dark');

  toggle.addEventListener('click', () => {
    const goingDark = root.getAttribute('data-theme') !== 'dark';
    root.setAttribute('data-theme', goingDark ? 'dark' : 'light');
    localStorage.setItem('-theme', goingDark ? 'dark' : 'light');
  });

  // Launch Sequence Animation
  let isLaunching = false;

  function triggerLaunch() {
    if (isLaunching) return;
    isLaunching = true;

    // 1. Text Update
    document.getElementById('headline').innerHTML = "Hold on to your butts...";
    document.getElementById('subheadline').innerText = "Initiating PySpire hyperdrive sequence.";

    // 2. Shake Screen
    document.body.classList.add('shake-hard');

    // 3. Rocket Launch
    const rocket = document.getElementById('rocket');
    rocket.classList.add('launch');
    createSmoke();

    // 4. Blow up the UI as the rocket hits it
    setTimeout(() => {
      document.getElementById('search-container').classList.add('poof');
      document.getElementById('redirect-btn').classList.add('poof');
    }, 700);

    // 5. Fade to Black
    setTimeout(() => {
      document.body.classList.remove('shake-hard');
      document.getElementById('fade-overlay').classList.add('active');
    }, 1800);

    // 6. Actual Redirect (Simulated with a reload or hash change, replace with actual URL)
    setTimeout(() => {
      // In a real scenario: window.location.href = 'https://pyspire.com';
      window.location.href = 'https://www.pyspire.com';
      
      // For the sake of the demo restarting:
      setTimeout(() => {
        alert("Redirecting to PySpire!");
        window.location.reload();
      }, 500);
    }, 2800);
  }

  // Smoke particle effect for the rocket
  function createSmoke() {
    let smokeCount = 0;
    const interval = setInterval(() => {
      if (smokeCount > 30) {
        clearInterval(interval);
        return;
      }
      const particle = document.createElement('div');
      particle.classList.add('smoke-particle');
      
      const size = Math.random() * 60 + 40;
      particle.style.width = `${size}px`;
      particle.style.height = `${size}px`;
      
      const offset = (Math.random() - 0.5) * 100;
      particle.style.left = `calc(50% + ${offset}px)`;
      
      document.body.appendChild(particle);
      
      setTimeout(() => {
        particle.remove();
      }, 1000);
      
      smokeCount++;
    }, 50);
  }
</script>
</body>
</html>
